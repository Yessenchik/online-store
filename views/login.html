<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register - Cases Store</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top bg-surface shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">Cases Store</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/products.html">Products</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Auth Section -->
    <section class="section d-flex align-items-center min-vh-100 py-5" style="margin-top: 56px">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
              <div class="card-body p-0">
                <!-- Login Form -->
                <div id="login-form" class="p-5">
                  <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Welcome Back</h2>
                    <p class="text-muted">Enter your credentials to access your account</p>
                  </div>

                  <form id="login-form-element" novalidate>
                    <div class="mb-3">
                      <label for="login-email" class="form-label fw-bold small text-uppercase">Email Address</label>
                      <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="ri-mail-line"></i></span>
                        <input
                          type="email"
                          class="form-control bg-light border-start-0 ps-0"
                          id="login-email"
                          required
                          placeholder="name@example.com"
                        />
                      </div>
                    </div>

                    <div class="mb-4">
                      <div class="d-flex justify-content-between">
                        <label for="login-password" class="form-label fw-bold small text-uppercase">Password</label>
                        <a href="#" class="small text-decoration-none text-muted">Forgot password?</a>
                      </div>
                      <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="ri-lock-line"></i></span>
                        <input
                          type="password"
                          class="form-control bg-light border-start-0 ps-0"
                          id="login-password"
                          required
                          placeholder="Enter your password"
                        />
                      </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase shadow-sm mb-4">
                      Sign In
                    </button>

                    <div class="text-center">
                      <p class="mb-0 text-muted">
                        Don't have an account?
                        <a
                          href="#"
                          class="fw-bold text-primary text-decoration-none"
                          onclick="
                            showRegister();
                            return false;
                          "
                          >Create one</a
                        >
                      </p>
                    </div>
                  </form>
                </div>

                <!-- Register Form -->
                <div id="register-form" class="p-5" style="display: none">
                  <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Create Account</h2>
                    <p class="text-muted">Join us for exclusive offers and faster checkout</p>
                  </div>

                  <form id="register-form-element" novalidate>
                    <div class="mb-3">
                      <label for="register-name" class="form-label fw-bold small text-uppercase">Full Name</label>
                      <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="ri-user-line"></i></span>
                        <input
                          type="text"
                          class="form-control bg-light border-start-0 ps-0"
                          id="register-name"
                          required
                          minlength="2"
                          placeholder="Yessenchik"
                        />
                      </div>
                    </div>

                    <div class="mb-3">
                      <label for="register-email" class="form-label fw-bold small text-uppercase">Email Address</label>
                      <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="ri-mail-line"></i></span>
                        <input
                          type="email"
                          class="form-control bg-light border-start-0 ps-0"
                          id="register-email"
                          required
                          placeholder="name@example.com"
                        />
                      </div>
                    </div>

                    <div class="mb-3">
                      <label for="register-password" class="form-label fw-bold small text-uppercase">Password</label>
                      <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="ri-lock-line"></i></span>
                        <input
                          type="password"
                          class="form-control bg-light border-start-0 ps-0"
                          id="register-password"
                          required
                          minlength="6"
                          placeholder="Min 6 characters"
                        />
                      </div>
                      <div class="form-text small">Must be at least 6 characters long</div>
                    </div>

                    <div class="mb-4">
                      <label for="register-phone" class="form-label fw-bold small text-uppercase"
                        >Phone Number (Optional)</label
                      >
                      <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="ri-phone-line"></i></span>
                        <input
                          type="tel"
                          class="form-control bg-light border-start-0 ps-0"
                          id="register-phone"
                          placeholder="+7"
                        />
                      </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase shadow-sm mb-4">
                      Register
                    </button>

                    <div class="text-center">
                      <p class="mb-0 text-muted">
                        Already have an account?
                        <a
                          href="#"
                          class="fw-bold text-primary text-decoration-none"
                          onclick="
                            showLogin();
                            return false;
                          "
                          >Login</a
                        >
                      </p>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
