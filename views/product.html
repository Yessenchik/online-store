<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Cases Store</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top bg-surface shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">Cases Store</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/cart.html">
                Cart <span id="cart-count" class="badge bg-primary rounded-pill">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard.html" id="dashboard-link" style="display: none">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin.html" id="admin-link" style="display: none">Admin</a>
            </li>
            <li class="nav-item ms-lg-3" id="user-name-display" style="display: none">
              <span class="nav-link text-primary fw-bold"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/login.html" id="auth-link">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="section" style="margin-top: 56px">
      <div class="container py-5">
        <div id="product-details">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>

        <div class="row mt-5">
          <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white border-bottom py-3">
                <h3 class="mb-0 fw-bold">Customer Reviews</h3>
              </div>
              <div class="card-body">
                <div id="review-summary" class="mb-4 p-3 bg-light rounded"></div>

                <div id="reviews-list" class="vstack gap-4">
                  <div class="text-center py-3 text-muted">Loading reviews...</div>
                </div>

                <hr class="my-5" />

                <div id="review-form-wrapper" style="display: none">
                  <h4 class="fw-bold mb-4">Write a Review</h4>
                  <form id="review-form">
                    <div class="mb-3">
                      <label for="review-rating" class="form-label">Rating</label>
                      <select id="review-rating" class="form-select" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Bad</option>
                      </select>
                    </div>
                    <div class="mb-3">
                      <label for="review-title" class="form-label">Title</label>
                      <input
                        type="text"
                        id="review-title"
                        class="form-control"
                        placeholder="Summarize your experience"
                        required
                      />
                    </div>
                    <div class="mb-3">
                      <label for="review-comment" class="form-label">Comment</label>
                      <textarea
                        id="review-comment"
                        class="form-control"
                        rows="4"
                        placeholder="Share details of your own experience with this product"
                        required
                      ></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                  </form>
                </div>
                <div id="review-form-message" class="mt-3"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white py-5 border-top mt-5">
      <div class="container">
        <div class="row gy-4">
          <div class="col-lg-4">
            <h4 class="text-primary fw-bold mb-3">Cases Store</h4>
            <p class="text-muted">Premium protection for your digital life.</p>
          </div>
          <div class="col-lg-2 col-6">
            <h6 class="fw-bold mb-3">Shop</h6>
            <ul class="list-unstyled">
              <li class="mb-2">
                <a href="/products.html" class="text-decoration-none text-muted hover-primary">All Products</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="border-top mt-5 pt-4 text-center text-muted small">
          &copy; 2024 Cases Store. All rights reserved.
        </div>
      </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/product.js"></script>
  </body>
</html>
